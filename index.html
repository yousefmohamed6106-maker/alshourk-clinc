<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة متابعة المذاكرة الشاملة | Study Mastery Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-secondary: rgba(22, 30, 49, 0.75);
            --bg-card: rgba(30, 41, 67, 0.5);
            --bg-glass: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.08);
            --accent-glow: rgba(99, 102, 241, 0.15);
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --radius-lg: 20px;
            --radius-md: 14px;
            --radius-sm: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(99, 102, 241, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(16, 185, 129, 0.08) 0%, transparent 40%);
            background-attachment: fixed;
            padding-bottom: 60px;
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 25px 20px;
        }

        /* Top Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--bg-secondary);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 20px 30px;
            margin-bottom: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .brand h1 {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, #a5b4fc, #6366f1, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            background: var(--bg-glass);
            border: 1px solid var(--border-glass);
            color: var(--text-main);
            padding: 10px 18px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(99, 102, 241, 0.3);
        }

        /* Widgets Section (Progress & Pomodoro) */
        .widgets-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 25px;
        }

        @media (max-width: 900px) {
            .widgets-grid { grid-template-columns: 1fr; }
        }

        .widget-card {
            background: var(--bg-secondary);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .progress-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .progress-bar-bg {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50px;
            height: 18px;
            width: 100%;
            overflow: hidden;
            border: 1px solid var(--border-glass);
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #10b981);
            width: 0%;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 50px;
        }

        .stats-summary {
            display: flex;
            gap: 25px;
            margin-top: 15px;
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .stats-summary span b {
            color: var(--text-main);
        }

        /* Pomodoro Timer */
        .pomodoro-display {
            text-align: center;
        }

        .timer-time {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 2px;
            font-family: monospace;
            color: #a5b4fc;
            margin: 10px 0;
        }

        .timer-controls {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        /* Filter Controls */
        .controls-bar {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .search-box {
            flex: 1;
            min-width: 250px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            padding: 12px 45px 12px 20px;
            border-radius: var(--radius-md);
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }

        .search-box i {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .filter-btn {
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            color: var(--text-muted);
            padding: 10px 20px;
            border-radius: var(--radius-md);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .filter-btn.active, .filter-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        /* Subjects Grid */
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(380px, 1fr));
            gap: 25px;
        }

        @media (max-width: 480px) {
            .subjects-grid { grid-template-columns: 1fr; }
        }

        .subject-card {
            background: var(--bg-secondary);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .subject-card:hover {
            border-color: rgba(99, 102, 241, 0.4);
        }

        .subject-header {
            padding: 20px;
            background: rgba(255, 255, 255, 0.02);
            border-bottom: 1px solid var(--border-glass);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .subject-title {
            font-size: 1.25rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .unit-section {
            padding: 15px 20px 5px;
        }

        .unit-title {
            font-size: 0.9rem;
            font-weight: 700;
            color: #a5b4fc;
            margin-bottom: 12px;
            padding-bottom: 5px;
            border-bottom: 1px stroke rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Lessons List */
        .lesson-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            padding: 12px 16px;
            border-radius: var(--radius-md);
            margin-bottom: 10px;
            transition: all 0.25s ease;
        }

        .lesson-item:hover {
            background: rgba(40, 53, 83, 0.7);
        }

        .lesson-item.completed {
            background: rgba(16, 185, 129, 0.06);
            border-color: rgba(16, 185, 129, 0.2);
        }

        .lesson-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex: 1;
        }

        .custom-checkbox {
            width: 22px;
            height: 22px;
            border: 2px solid var(--text-muted);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .lesson-item.completed .custom-checkbox {
            background: var(--success);
            border-color: var(--success);
        }

        .custom-checkbox i {
            color: white;
            font-size: 12px;
            opacity: 0;
            transform: scale(0.5);
            transition: all 0.2s ease;
        }

        .lesson-item.completed .custom-checkbox i {
            opacity: 1;
            transform: scale(1);
        }

        .lesson-name {
            font-size: 0.95rem;
            font-weight: 500;
            transition: color 0.2s ease;
        }

        .lesson-item.completed .lesson-name {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        .lesson-actions {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 5px;
            border-radius: var(--radius-sm);
            transition: color 0.2s ease;
        }

        .icon-btn:hover {
            color: var(--primary);
        }

        /* Rules & Vault Drawer */
        .vault-section {
            margin-top: 35px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-lg);
            padding: 25px;
        }

        .vault-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .vault-inputs {
            display: grid;
            grid-template-columns: 1fr 1fr 2fr auto;
            gap: 12px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .vault-inputs { grid-template-columns: 1fr; }
        }

        .vault-inputs input, .vault-inputs select, .vault-inputs textarea {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            padding: 10px 15px;
            border-radius: var(--radius-md);
            color: var(--text-main);
            outline: none;
        }

        .rules-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .rule-card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            padding: 15px;
            position: relative;
        }

        .rule-tag {
            font-size: 0.75rem;
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
            padding: 3px 8px;
            border-radius: 4px;
            display: inline-block;
            margin-bottom: 8px;
        }

        .rule-title {
            font-weight: 700;
            margin-bottom: 5px;
        }

        .rule-content {
            font-size: 0.9rem;
            color: var(--text-muted);
            white-space: pre-wrap;
        }

        .delete-rule {
            position: absolute;
            top: 10px;
            left: 10px;
            color: var(--danger);
            cursor: pointer;
            opacity: 0.7;
        }

        .delete-rule:hover { opacity: 1; }

        /* Modal for Lesson Notes */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-box {
            background: var(--bg-primary);
            border: 1px solid var(--border-glass);
            width: 90%;
            max-width: 550px;
            border-radius: var(--radius-lg);
            padding: 25px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-box textarea {
            width: 100%;
            height: 150px;
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            border-radius: var(--radius-md);
            color: var(--text-main);
            padding: 12px;
            outline: none;
            resize: none;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <div class="brand">
                <h1><i class="fa-solid fa-graduation-cap"></i> منصة متابعة الإنجاز الدراسي</h1>
            </div>
            <div class="header-actions">
                <button class="btn" onclick="exportData()"><i class="fa-solid fa-download"></i> تصدير البيانات</button>
                <button class="btn" onclick="document.getElementById('importFile').click()"><i class="fa-solid fa-upload"></i> استيراد</button>
                <input type="file" id="importFile" style="display:none" onchange="importData(event)">
            </div>
        </header>

        <!-- Widgets Dashboard -->
        <div class="widgets-grid">
            <!-- Overall Progress Widget -->
            <div class="widget-card">
                <div class="progress-header">
                    <h3><i class="fa-solid fa-chart-line" style="color: #6366f1;"></i> نسبة الإنجاز العام</h3>
                    <h2 id="progressPercent" style="color: #10b981;">0%</h2>
                </div>
                <div class="progress-bar-bg">
                    <div class="progress-bar-fill" id="progressBar"></div>
                </div>
                <div class="stats-summary">
                    <span>الدروس المكتملة: <b id="completedCount">0</b></span>
                    <span>المتبقية: <b id="remainingCount">0</b></span>
                    <span>إجمالي الدروس: <b id="totalCount">0</b></span>
                </div>
            </div>

            <!-- Focus Pomodoro Widget -->
            <div class="widget-card pomodoro-display">
                <h3><i class="fa-solid fa-clock" style="color: #f59e0b;"></i> مؤقت التركيز (Pomodoro)</h3>
                <div class="timer-time" id="timerDisplay">25:00</div>
                <div class="timer-controls">
                    <button class="btn" id="startTimerBtn" onclick="toggleTimer()"><i class="fa-solid fa-play"></i> بدء</button>
                    <button class="btn" onclick="resetTimer()"><i class="fa-solid fa-rotate-right"></i> إعادة</button>
                </div>
            </div>
        </div>

        <!-- Filters & Search Bar -->
        <div class="controls-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="ابحث عن درس أو وحدة معين..." oninput="renderDashboard()">
            </div>
            <button class="filter-btn active" onclick="setFilter('all', this)">الكل</button>
            <button class="filter-btn" onclick="setFilter('completed', this)">المكتملة</button>
            <button class="filter-btn" onclick="setFilter('pending', this)">المتبقية</button>
        </div>

        <!-- Main Content: Subjects Grid -->
        <div class="subjects-grid" id="subjectsGrid"></div>

        <!-- Formula & Important Rules Vault -->
        <div class="vault-section">
            <div class="vault-header">
                <h3><i class="fa-solid fa-book-bookmark" style="color: #a5b4fc;"></i> بنك القوانين والقواعد والملاحظات الهامة</h3>
            </div>
            <div class="vault-inputs">
                <select id="ruleSubject">
                    <option value="الرياضيات">الرياضيات</option>
                    <option value="العلوم">العلوم</option>
                    <option value="اللغة العربية">اللغة العربية</option>
                    <option value="الكمبيوتر">الكمبيوتر</option>
                    <option value="عام">عام / ملاحظة</option>
                </select>
                <input type="text" id="ruleTitle" placeholder="عنوان القانون / القاعدة">
                <textarea id="ruleContent" placeholder="اكتب النص أو القانون هنا..." rows="1"></textarea>
                <button class="btn" onclick="addRule()"><i class="fa-solid fa-plus"></i> إضافة</button>
            </div>
            <div class="rules-grid" id="rulesGrid"></div>
        </div>
    </div>

    <!-- Lesson Notes Modal -->
    <div class="modal-overlay" id="notesModal">
        <div class="modal-box">
            <div class="modal-header">
                <h3 id="modalLessonTitle">ملاحظات الدرس</h3>
                <button class="icon-btn" onclick="closeNotesModal()"><i class="fa-solid fa-xmark fa-lg"></i></button>
            </div>
            <textarea id="modalNotesText" placeholder="سجل هنا أي نقاط مهمة، تعاريف، أو أسئلة تحتاج مراجعتها لاحقاً..."></textarea>
            <button class="btn" style="width: 100%; justify-content: center;" onclick="saveLessonNotes()"><i class="fa-solid fa-floppy-disk"></i> حفظ الملاحظة</button>
        </div>
    </div>

                    {
                        name: "ثالثاً: القواعد النحوية",
                        lessons: ["من مفاتيح الإعراب والمراجعة العامة", "الدرس الأول: اسم الفاعل", "الدرس الثاني: اسم المفعول", "الدرس الثالث: صيغ المبالغة", "الدرس الرابع: اسم المكان", "الدرس الخامس: اسم الزمان", "الدرس السادس: اسم الآلة", "تدريبات القواعد النحوية الشاملة"]
                    },
                    {
                        name: "رابعاً وخامساً وسادساً: الإملاء والتعبير والتحدث",
                        lessons: ["القواعد الإملائية: كتابة الهمزة في بداية ووسط الكلمة والهمزة المتطرفة", "التعبير الكتابي: كتابة نص إقناعي وتعديل تقرير صحفي", "التحدث والتدريبات الشاملة"]
                    }
                ]
            },
            {
                subject: "الرياضيات (Mathematics)",
                icon: "fa-calculator",
                units: [
                    {
                        name: "Unit 1: Numbers and operations on them",
                        lessons: ["Lesson 1: Powers of Powers", "Lesson 2: Exponential Equations"]
                    },
                    {
                        name: "Unit 2: Algebra",
                        lessons: ["Lesson 1: Quadratic Function", "Lesson 2: Set of Real Zeros of Polynomial Functions", "Lesson 3: Rational Algebraic Functions", "Lesson 4: Common Domain and Equivalent Rational Algebraic Functions", "Lesson 5: Operations on Rational Algebraic Fractions (Part 1: Addition & Subtraction)", "Lesson 6: Operations on Rational Algebraic Fractions (Part 2: Multiplication & Division)"]
                    },
                    {
                        name: "Unit 3: Geometry",
                        lessons: ["Lesson 1: Similarity of Polygons", "Lesson 2: Similarity of Triangles", "Lesson 3: Dilation", "Lesson 4: Trigonometric Ratios of an Acute Angle", "Lesson 5: Trigonometric Ratios of Some Special Angles", "Lesson 6: The Relation between the Slopes of two Parallel and Perpendicular Straight Lines", "Lesson 7: Equation of the Straight Line"]
                    },
                    {
                        name: "Unit 4: Statistics",
                        lessons: ["Lesson 1: Measures of Dispersion (Part 1: Range & Interquartile Range)", "Lesson 2: Measures of Dispersion (Part 2: Standard Deviation)"]
                    }
                ]
            },
            {
                subject: "الكمبيوتر وتكنولوجيا المعلومات",
                icon: "fa-laptop-code",
                units: [
                    {
                        name: "Unit 1: Artificial Intelligence and Programming Languages",
                        lessons: ["Lesson 1: Computational Thinking and Problem Solving", "Lesson 2: Artificial Intelligence Algorithms", "Lesson 3: Strings and Lists in Python", "Lesson 4: Functions with Parameters in Python", "Lesson 5: Handling User Input Errors in Python", "Summary & Revision on Unit 1"]
                    },
                    {
                        name: "Unit 2: Artificial Intelligence and Cybersecurity",
                        lessons: ["Lesson 1: Prediction Using an Artificial Intelligence Model", "Lesson 2: Artificial Intelligence and Intellectual Property Rights", "Lesson 3: Cyber Awareness and Dangerous Electronic Games", "Lesson 4: Artificial Intelligence and Deepfakes", "Summary & Revision on Unit 2"]
                    }
                ]
            },
            {
                subject: "اللغة الإنجليزية (English)",
                icon: "fa-language",
                units: [
                    {
                        name: "Part Two - Grade 9 Journey",
                        lessons: [
                            "UNIT 1: Personal Identity",
                            "UNIT 2: Communication with Family and Friends",
                            "UNIT 3: Artificial Intelligence",
                            "REVIEW 1",
                            "UNIT 4: Screen Time",
                            "UNIT 5: Design Thinking",
                            "UNIT 6: Why Do We Like Stories?",
                            "REVIEW 2",
                            "The Story: The School Garden Project"
                        ]
                    }
                ]
            }
        ];

        // State Management
        let userProgress = JSON.parse(localStorage.getItem('study_progress_v2')) || {};
        let userNotes = JSON.parse(localStorage.getItem('study_notes_v2')) || {};
        let userRules = JSON.parse(localStorage.getItem('study_rules_v2')) || [];
        let currentFilter = 'all';
        let activeLessonForNotes = '';

        // App Initialization
        document.addEventListener('DOMContentLoaded', () => {
            renderDashboard();
            renderRules();
            updateOverallProgress();
        });

        // Unique Key Generator for Lessons
        function getLessonKey(subject, unitName, lesson) {
            return `${subject}_${unitName}_${lesson}`.replace(/\s+/g, '_');
        }

        // Render Main Dashboard Grid
        function renderDashboard() {
            const grid = document.getElementById('subjectsGrid');
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            grid.innerHTML = '';

            curriculumData.forEach(subj => {
                let subjectHTML = '';
                let hasMatchingLessons = false;

                subj.units.forEach(unit => {
                    let unitLessonsHTML = '';

                    unit.lessons.forEach(lesson => {
                        const key = getLessonKey(subj.subject, unit.name, lesson);
                        const isCompleted = !!userProgress[key];
                        const noteText = userNotes[key] || '';

                        // Filters Check
                        if (currentFilter === 'completed' && !isCompleted) return;
                        if (currentFilter === 'pending' && isCompleted) return;

                        // Search Check
                        if (searchVal && !lesson.toLowerCase().includes(searchVal) && !unit.name.toLowerCase().includes(searchVal)) return;

                        hasMatchingLessons = true;

                        unitLessonsHTML += `
                            <div class="lesson-item ${isCompleted ? 'completed' : ''}" id="card_${key}">
                                <div class="lesson-left" onclick="toggleLesson('${key}')">
                                    <div class="custom-checkbox">
                                        <i class="fa-solid fa-check"></i>
                                    </div>
                                    <span class="lesson-name">${lesson}</span>
                                </div>
                                <div class="lesson-actions">
                                    <button class="icon-btn" title="إضافة/تعديل ملاحظة" onclick="openNotesModal('${key}', '${lesson.replace(/'/g, "\\'")}')">
                                        <i class="fa-solid fa-note-sticky" style="${noteText ? 'color:#f59e0b' : ''}"></i>
                                    </button>
                                </div>
                            </div>
                        `;
                    });

                    if (unitLessonsHTML) {
                        subjectHTML += `
                            <div class="unit-section">
                                <div class="unit-title"><i class="fa-solid fa-folder-open"></i> ${unit.name}</div>
                                ${unitLessonsHTML}
                            </div>
                        `;
                    }
                });

                if (hasMatchingLessons || !searchVal) {
                    const card = document.createElement('div');
                    card.className = 'subject-card';
                    card.innerHTML = `
                        <div class="subject-header">
                            <div class="subject-title">
                                <i class="fa-solid ${subj.icon}" style="color: #6366f1;"></i>
                                ${subj.subject}
                            </div>
                        </div>
                        ${subjectHTML || '<div style="padding: 20px; color: var(--text-muted);">لا توجد دروس مطابقة للبحث</div>'}
                    `;
                    grid.appendChild(card);
                }
            });

            updateOverallProgress();
        }

        // Toggle Lesson Completion Status
        function toggleLesson(key) {
            userProgress[key] = !userProgress[key];
            localStorage.setItem('study_progress_v2', JSON.stringify(userProgress));
            
            const card = document.getElementById(`card_${key}`);
            if (card) {
                card.classList.toggle('completed');
            }

            // Confetti Trigger on completion
            if (userProgress[key]) {
                confetti({
                    particleCount: 50,
                    spread: 60,
                    origin: { y: 0.8 }
                });
            }

            updateOverallProgress();
        }

        // Calculate and Update Progress Widget
        function updateOverallProgress() {
            let total = 0;
            let completed = 0;

            curriculumData.forEach(subj => {
                subj.units.forEach(unit => {
                    unit.lessons.forEach(lesson => {
                        total++;
                        const key = getLessonKey(subj.subject, unit.name, lesson);
                        if (userProgress[key]) completed++;
                    });
                });
            });

            const percent = total > 0 ? Math.round((completed / total) * 100) : 0;
            
            document.getElementById('totalCount').innerText = total;
            document.getElementById('completedCount').innerText = completed;
            document.getElementById('remainingCount').innerText = total - completed;
            document.getElementById('progressPercent').innerText = `${percent}%`;
            document.getElementById('progressBar').style.width = `${percent}%`;
        }

        // Set Lesson Filter
        function setFilter(filter, btn) {
            currentFilter = filter;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderDashboard();
        }

        // Modal Controls for Lesson Notes
        function openNotesModal(key, title) {
            activeLessonForNotes = key;
            document.getElementById('modalLessonTitle').innerText = title;
            document.getElementById('modalNotesText').value = userNotes[key] || '';
            document.getElementById('notesModal').classList.add('active');
        }

        function closeNotesModal() {
            document.getElementById('notesModal').classList.remove('active');
            activeLessonForNotes = '';
        }

        function saveLessonNotes() {
            if (!activeLessonForNotes) return;
            const val = document.getElementById('modalNotesText').value.trim();
            if (val) {
                userNotes[activeLessonForNotes] = val;
            } else {
                delete userNotes[activeLessonForNotes];
            }
            localStorage.setItem('study_notes_v2', JSON.stringify(userNotes));
            closeNotesModal();
            renderDashboard();
        }

        // Formula & Rules Vault Logic
        function addRule() {
            const subject = document.getElementById('ruleSubject').value;
            const title = document.getElementById('ruleTitle').value.trim();
            const content = document.getElementById('ruleContent').value.trim();

            if (!title || !content) {
                alert('يرجى ملء عنوان القانون والمحتوى');
                return;
            }

            userRules.unshift({ id: Date.now(), subject, title, content });
            localStorage.setItem('study_rules_v2', JSON.stringify(userRules));
            
            document.getElementById('ruleTitle').value = '';
            document.getElementById('ruleContent').value = '';
            renderRules();
        }

        function deleteRule(id) {
            userRules = userRules.filter(r => r.id !== id);
            localStorage.setItem('study_rules_v2', JSON.stringify(userRules));
            renderRules();
        }

        function renderRules() {
            const container = document.getElementById('rulesGrid');
            container.innerHTML = '';

            userRules.forEach(rule => {
                const el = document.createElement('div');
                el.className = 'rule-card';
                el.innerHTML = `
                    <i class="fa-solid fa-trash delete-rule" onclick="deleteRule(${rule.id})"></i>
                    <span class="rule-tag">${rule.subject}</span>
                    <div class="rule-title">${rule.title}</div>
                    <div class="rule-content">${rule.content}</div>
                `;
                container.appendChild(el);
            });
        }

        // Pomodoro Timer Logic
        let timerInterval = null;
        let timerSeconds = 25 * 60;
        let isTimerRunning = false;

        function toggleTimer() {
            const btn = document.getElementById('startTimerBtn');
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                btn.innerHTML = '<i class="fa-solid fa-play"></i> استئناف';
            } else {
                isTimerRunning = true;
                btn.innerHTML = '<i class="fa-solid fa-pause"></i> إيقاف مؤقت';
                timerInterval = setInterval(() => {
                    if (timerSeconds > 0) {
                        timerSeconds--;
                        updateTimerDisplay();
                    } else {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        alert('انتهت جلسة المذاكرة! خذ قسطاً من الراحة.');
                        resetTimer();
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timerSeconds = 25 * 60;
            document.getElementById('startTimerBtn').innerHTML = '<i class="fa-solid fa-play"></i> بدء';
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const mins = Math.floor(timerSeconds / 60);
            const secs = timerSeconds % 60;
            document.getElementById('timerDisplay').innerText = 
                `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }

        // Import & Export Backup Data
        function exportData() {
            const data = {
                progress: userProgress,
                notes: userNotes,
                rules: userRules
            };
            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Study_Backup_${new Date().toISOString().slice(0,10)}.json`;
            a.click();
        }

        function importData(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const data = JSON.parse(event.target.result);
                    if (data.progress) localStorage.setItem('study_progress_v2', JSON.stringify(data.progress));
                    if (data.notes) localStorage.setItem('study_notes_v2', JSON.stringify(data.notes));
                    if (data.rules) localStorage.setItem('study_rules_v2', JSON.stringify(data.rules));

                    userProgress = data.progress || {};
                    userNotes = data.notes || {};
                    userRules = data.rules || [];

                    renderDashboard();
                    renderRules();
                    alert('تم استيراد البيانات بنجاح!');
                } catch(err) {
                    alert('ملف غير صالح!');
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
